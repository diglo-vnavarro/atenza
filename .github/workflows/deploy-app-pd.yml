name: Deploy app (pd)

# PRODUCCIÓN (proyecto diglo-desk-pd).
# Modelo común Diglosfera/HUB360: `release/pd` es una rama de despliegue, no de
# desarrollo. Solo avanza por fast-forward desde `main` (ver docs/git-workflow.md):
#   git switch release/pd && git pull --ff-only origin release/pd
#   git merge --ff-only origin/main && git push origin release/pd
# Cada push a `release/pd` despliega a producción. `workflow_dispatch` permite
# redesplegar el estado actual de la rama (p. ej. tras un rollback de la rama al tag
# rollback/release-pd-<fecha>).
#
# Despliega hosting + reglas de Firestore/Storage (mismo alcance que el antiguo
# deploy.yml). Las Cloud Functions y la extensión de correo se despliegan a mano en pd
# (infra/README.md §4). El Job de la sync lo despliega deploy-sync.yml.
# Autenticación sin claves: Workload Identity Federation (OIDC de GitHub → GCP).
# Secrets: entorno de GitHub `production` (ver infra/README.md §4).

on:
  push:
    branches:
      - release/pd
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # necesario para Workload Identity Federation

concurrency:
  group: deploy-pd
  cancel-in-progress: false # nunca cancelar un despliegue a producción a medias

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Tests
        run: npm test

      - name: Build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
        run: npm run build

      - name: Autenticación GCP (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.DEPLOY_SA_EMAIL }}

      - name: Deploy a Firebase (pd)
        env:
          GOOGLE_CLOUD_QUOTA_PROJECT: diglo-desk-pd
        run: >
          npx --yes firebase-tools deploy
          --only hosting,firestore:rules,storage
          --project diglo-desk-pd
          --non-interactive
