name: Deploy sync job

# Construye y despliega el Cloud Run Job `sync-sdp` (sync SDP → ticketIN).
# El CI de deploy-app-pd.yml solo hace Firebase (hosting/reglas); esto es el Job de la sync.
# Es infraestructura de PRODUCCIÓN: se dispara desde la rama de release (`release/pd`,
# que solo avanza por fast-forward desde `main`; ver docs/git-workflow.md), no desde
# `main` (= dv, donde los Jobs no existen). Ver docs/deploy-sync.md.
# Autenticación sin claves: Workload Identity Federation.

on:
  workflow_dispatch:
    inputs:
      execute:
        description: 'Ejecutar el job tras desplegar'
        type: boolean
        default: false
  push:
    branches: [release/pd]
    paths:
      - 'Dockerfile'
      - 'scripts/**'
      - 'importer/**'
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-sync.yml'

permissions:
  contents: read
  id-token: write # Workload Identity Federation

concurrency:
  group: deploy-sync-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT: diglo-desk-pd
  REGION: europe-west1
  JOB: sync-sdp
  IMAGE: europe-west1-docker.pkg.dev/diglo-desk-pd/atenza/sync:latest

jobs:
  deploy-sync:
    # En push a release/pd, solo si la variable de repo CI_DEPLOY_SYNC=true. Manual: siempre.
    if: ${{ github.event_name == 'workflow_dispatch' || vars.CI_DEPLOY_SYNC == 'true' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7

      - name: Autenticación GCP (WIF)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          # SA con cloudbuild.builds.editor + artifactregistry.writer + run.developer
          # + iam.serviceAccountUser sobre atenza-sync@. Ver docs/deploy-sync.md.
          service_account: ${{ secrets.SYNC_DEPLOY_SA_EMAIL }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Construir imagen (Cloud Build)
        run: gcloud builds submit --tag "$IMAGE" --project "$PROJECT" .

      - name: Actualizar el Job a la imagen nueva
        run: gcloud run jobs update "$JOB" --image "$IMAGE" --region "$REGION" --project "$PROJECT"

      - name: Ejecutar el Job (opcional, solo manual)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.execute }}
        run: gcloud run jobs execute "$JOB" --region "$REGION" --project "$PROJECT" --wait
